# API Gateway local: balanceia entre réplicas (DNS do Docker), retry em outra réplica se uma cair.
resolver 127.0.0.11 valid=5s ipv6=off;

map $uri $svc {
  ~^/api/cadastro/     cadastro;
  ~^/api/agendamento/  agendamento;
  ~^/api/consulta/     consulta;
  ~^/api/receita/      receita;
  ~^/api/venda/        venda;
  ~^/api/pedido/       pedido;
  ~^/api/pagamento/    pagamento;
  ~^/api/entrega/      entrega;
  ~^/api/estoque/      estoque;
  ~^/api/nf/           nf-worker;
  ~^/api/admin/        admin;
  default              "";
}

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
  listen 80;

  location = /health { return 200 'ok'; }

  # CMS (Strapi) pelo gateway: as landings não precisam saber a porta do Strapi em cada ambiente
  location /cms/ {
    set $cms strapi;
    rewrite ^/cms(/.*)$ $1 break;
    proxy_pass http://$cms:1337;
    proxy_connect_timeout 2s;
  }

  location /api/ {
    if ($svc = "") { return 404; }
    limit_req zone=api burst=100 nodelay;
    rewrite ^/api/[^/]+(/.*)$ $1 break;
    proxy_pass http://$svc:3000;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 non_idempotent; # seguro: POST exige Idempotency-Key
    proxy_next_upstream_tries 3;
  }

  # landing de consultas (porta de entrada: consulta -> receita -> compra)
  location / { root /usr/share/nginx/html/consultas; try_files $uri /index.html; }
  # landing de vendas (ordem inversa: produto -> exige receita -> agenda consulta)
  # áreas administrativas (médico, paciente, estoque, expedição, operações, caos)
  location /admin/ { alias /usr/share/nginx/html/admin/; try_files $uri /admin/index.html; }
  location /loja/ { alias /usr/share/nginx/html/vendas/; try_files $uri /loja/index.html; }
}
